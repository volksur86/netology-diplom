---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Download Zabbix repo package
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu22.04_all.deb"
    dest: /tmp/zabbix-release_latest_7.0+ubuntu22.04_all.deb
    mode: '0644'

- name: Install Zabbix repo package
  ansible.builtin.apt:
    deb: /tmp/zabbix-release_latest_7.0+ubuntu22.04_all.deb

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Zabbix agent
  ansible.builtin.apt:
    name: zabbix-agent
    state: present

- name: Configure Zabbix agent Server
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^Server='
    line: "Server={{ zabbix_server_address }}"
    backup: yes

- name: Configure Zabbix agent ServerActive
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^ServerActive='
    line: "ServerActive={{ zabbix_server_address }}"
    backup: yes

- name: Ensure Hostname set to system hostname
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^Hostname='
    line: "Hostname={{ ansible_hostname }}"
    backup: yes

- name: Enable and restart Zabbix agent
  ansible.builtin.service:
    name: zabbix-agent
    state: restarted
    enabled: yes
