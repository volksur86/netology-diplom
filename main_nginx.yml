---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Copy static site
  ansible.builtin.copy:
    src: index.html
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
